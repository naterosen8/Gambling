<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gambling</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f0f0f0; --muted: #a0a0a0; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Gambling</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
